name: Capture TVer Engagement
run-name: 'Capture TVer Engagement ${{ inputs.batchId }}'

on:
  workflow_dispatch:
    inputs:
      batchId:
        description: 'Orchestrator batch ID'
        required: false
        type: string

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture TVer engagement
        env:
          TVER_ENGAGEMENT_GAS_WEB_APP_URL: ${{ secrets.TVER_ENGAGEMENT_GAS_WEB_APP_URL }}
          GAS_WEB_APP_TOKEN: ${{ secrets.GAS_WEB_APP_TOKEN }}
        run: npm run capture:tver-engagement

      - name: Notify GAS orchestrator of completion
        if: ${{ always() && inputs.batchId != '' }}
        continue-on-error: true
        env:
          TVER_ORCHESTRATOR_CALLBACK_URL: ${{ secrets.TVER_ORCHESTRATOR_CALLBACK_URL }}
          TVER_ORCHESTRATOR_CALLBACK_TOKEN: ${{ secrets.TVER_ORCHESTRATOR_CALLBACK_TOKEN }}
          TVER_ORCHESTRATOR_BATCH_ID: ${{ inputs.batchId }}
          TVER_ORCHESTRATOR_STEP: engagement
          TVER_ORCHESTRATOR_WORKFLOW_FILE: capture-tver-engagement.yml
          TVER_ORCHESTRATOR_CONCLUSION: ${{ job.status }}
          TVER_ORCHESTRATOR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-tver-orchestrator.js
