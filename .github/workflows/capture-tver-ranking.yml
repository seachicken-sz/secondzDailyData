name: Capture TVer Ranking
run-name: 'Capture TVer Ranking ${{ inputs.batchId }}'

on:
  workflow_dispatch:
    inputs:
      batchId:
        description: 'Orchestrator batch ID'
        required: false
        type: string
      rankingType:
        description: 'Ranking type. all / drama / variety / talk / vtr / local / empty means all'
        required: false
        default: ''

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture TVer ranking
        env:
          GAS_WEB_APP_RANK_URL: ${{ secrets.GAS_WEB_APP_RANK_URL }}
          GAS_WEB_APP_TOKEN: ${{ secrets.GAS_WEB_APP_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.rankingType }}" ]; then
            npm run capture:tver-ranking -- --type=${{ github.event.inputs.rankingType }}
          else
            npm run capture:tver-ranking
          fi

      - name: Notify GAS orchestrator of completion
        if: ${{ always() && inputs.batchId != '' }}
        continue-on-error: true
        env:
          TVER_ORCHESTRATOR_CALLBACK_URL: ${{ secrets.TVER_ORCHESTRATOR_CALLBACK_URL }}
          TVER_ORCHESTRATOR_CALLBACK_TOKEN: ${{ secrets.TVER_ORCHESTRATOR_CALLBACK_TOKEN }}
          TVER_ORCHESTRATOR_BATCH_ID: ${{ inputs.batchId }}
          TVER_ORCHESTRATOR_STEP: ranking
          TVER_ORCHESTRATOR_WORKFLOW_FILE: capture-tver-ranking.yml
          TVER_ORCHESTRATOR_CONCLUSION: ${{ job.status }}
          TVER_ORCHESTRATOR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-tver-orchestrator.js
