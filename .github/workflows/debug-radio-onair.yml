name: Debug Radio On Air
on:
  workflow_dispatch:
    inputs:
      station:
        description: "all = alpha_station, crossfm, fm_yokohama; jfn = TOKYO FM"
        required: true
        type: choice
        default: all
        options:
          - all
          - jfn
          - fm_yokohama
          - crossfm
          - alpha_station
permissions:
  contents: read
concurrency:
  group: debug-radio-onair
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Inspect public search pages
        env:
          DEBUG_STATION: ${{ inputs.station }}
        run: |
          if [ "$DEBUG_STATION" = jfn ]; then
            node scripts/debug-radio-onair.js
          else
            node scripts/debug-radio-stations.js "$DEBUG_STATION"
          fi
