name: Capture Stationhead
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capture-stationhead
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-stationhead.js
        env:
          STATIONHEAD_GAS_URL: ${{ secrets.STATIONHEAD_GAS_URL }}
          STATIONHEAD_GAS_TOKEN: ${{ secrets.STATIONHEAD_GAS_TOKEN }}
