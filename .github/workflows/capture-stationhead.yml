name: Capture Stationhead
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capture-stationhead
  cancel-in-progress: false
jobs:
  capture:
    if: vars.STATIONHEAD_CAPTURE_AUTHORIZED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-stationhead.js
        env:
          STATIONHEAD_CAPTURE_AUTHORIZED: ${{ vars.STATIONHEAD_CAPTURE_AUTHORIZED }}
          STATIONHEAD_GAS_URL: ${{ secrets.STATIONHEAD_GAS_URL }}
          STATIONHEAD_GAS_TOKEN: ${{ secrets.STATIONHEAD_GAS_TOKEN }}
