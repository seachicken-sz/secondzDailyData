name: Capture Dreampass

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-dreampass
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture Dreampass rankings
        id: rankings
        env:
          DREAMPASS_WEB_APP_URL: ${{ secrets.DREAMPASS_WEB_APP_URL }}
          DREAMPASS_SYNC_TOKEN: ${{ secrets.DREAMPASS_SYNC_TOKEN }}
        run: node scripts/capture-dreampass.js


      - name: Capture Dreampass tickets
        if: ${{ !cancelled() && (steps.rankings.outcome == 'success' || steps.rankings.outcome == 'failure') }}
        env:
          DREAMPASS_WEB_APP_URL: ${{ secrets.DREAMPASS_WEB_APP_URL }}
          DREAMPASS_SYNC_TOKEN: ${{ secrets.DREAMPASS_SYNC_TOKEN }}
        run: node scripts/capture-dreampass-tickets.js
