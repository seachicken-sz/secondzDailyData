name: Capture Dreampass

on:
  schedule:
    # UTC 00:00 / 12:00 = 日本時間 09:00 / 21:00
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-dreampass
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture and update spreadsheet
        env:
          DREAMPASS_WEB_APP_URL: ${{ secrets.DREAMPASS_WEB_APP_URL }}
          DREAMPASS_SYNC_TOKEN: ${{ secrets.DREAMPASS_SYNC_TOKEN }}
        run: node scripts/capture-dreampass.js
